<!DOCTYPE html>

<html lang="kk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Техникалық қолдау — MEDCARE
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f8fc;

            color:
                #173a57;
        }


        .page {
            max-width: 1100px;

            margin:
                40px auto;

            padding:
                20px;
        }


        .support-card {

            background:
                white;

            border:
                1px solid #dce8f0;

            border-radius:
                20px;

            overflow:
                hidden;

            box-shadow:
                0 8px 30px
                rgba(25, 80, 120, 0.08);
        }


        /* HEADER */

        .support-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding:
                20px 25px;

            border-bottom:
                1px solid #e5edf3;
        }


        .support-user {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;
        }


        .support-avatar {

            width:
                45px;

            height:
                45px;

            border-radius:
                50%;

            background:
                #eaf6ff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                22px;
        }


        .support-user h3 {

            margin:
                0 0 3px;

            font-size:
                16px;
        }


        .support-user small {

            color:
                #8194a4;
        }


        .online {

            color:
                #1b9b58;

            font-size:
                12px;

            font-weight:
                bold;
        }


        /* CHAT */

        .chat {

            height:
                450px;

            overflow-y:
                auto;

            padding:
                25px;

            background:
                #f8fbfd;
        }


        /* SUPPORT MESSAGE */

        .support-message {

            max-width:
                520px;

            background:
                white;

            border:
                1px solid #dce8f0;

            border-radius:
                16px;

            padding:
                18px;

            margin-bottom:
                18px;

            line-height:
                1.6;

            font-size:
                14px;
        }


        /* USER MESSAGE */

        .user-message {

            max-width:
                520px;

            margin-left:
                auto;

            margin-bottom:
                15px;

            padding:
                13px 16px;

            background:
                #1684d5;

            color:
                white;

            border-radius:
                16px 16px 4px 16px;

            font-size:
                14px;

            line-height:
                1.5;
        }


        /* SYSTEM */

        .system-message {

            max-width:
                520px;

            background:
                #eaf8ef;

            color:
                #267548;

            border:
                1px solid #ccebd8;

            border-radius:
                14px;

            padding:
                13px 16px;

            margin-bottom:
                15px;

            font-size:
                13px;
        }


        .error-message {

            max-width:
                520px;

            background:
                #fff0f0;

            color:
                #a84444;

            border:
                1px solid #ffd1d1;

            border-radius:
                14px;

            padding:
                13px 16px;

            margin-bottom:
                15px;

            font-size:
                13px;
        }


        /* INPUT */

        .chat-input {

            display:
                flex;

            gap:
                10px;

            padding:
                15px;

            background:
                white;

            border-top:
                1px solid #e2ebf1;
        }


        .chat-input textarea {

            flex:
                1;

            min-height:
                55px;

            max-height:
                120px;

            resize:
                none;

            border:
                1px solid #cfe0eb;

            border-radius:
                13px;

            padding:
                15px;

            outline:
                none;

            font-family:
                inherit;

            font-size:
                14px;
        }


        .chat-input textarea:focus {

            border-color:
                #1684d5;
        }


        .send-btn {

            width:
                60px;

            border:
                none;

            border-radius:
                13px;

            background:
                #1684d5;

            color:
                white;

            cursor:
                pointer;

            font-size:
                22px;

            transition:
                .2s;
        }


        .send-btn:hover {

            background:
                #0878bd;

            transform:
                translateY(-2px);
        }


        .send-btn:disabled {

            opacity:
                .5;

            cursor:
                not-allowed;

            transform:
                none;
        }


        .info {

            margin-top:
                12px;

            font-size:
                11px;

            color:
                #8a9dab;
        }


        @media(max-width:700px) {

            .page {

                margin:
                    0;

                padding:
                    10px;
            }


            .chat {

                height:
                    60vh;
            }

        }

    </style>

<link rel="stylesheet" href="css/medcare-unified.css">
</head>


<body>


<div class="page">


    <div class="support-card">


        <!-- HEADER -->

        <div class="support-header">


            <div class="support-user">

                <div class="support-avatar">
                    🎧
                </div>


                <div>

                    <h3>
                        MedCare қолдау қызметі
                    </h3>

                    <small>
                        Жалпы сұрақ
                    </small>

                </div>

            </div>


            <div class="online">
                ● Онлайн
            </div>

        </div>



        <!-- CHAT -->

        <div
            class="chat"
            id="chat"
        >


            <div class="support-message">

                <strong>
                    🎧 MedCare Support:
                </strong>

                <br><br>

                Сәлеметсіз бе! 👋

                <br>

                MedCare техникалық қолдау
                қызметіне қош келдіңіз.

                <br><br>

                Мәселеңізді төменге
                жазып жіберіңіз.

            </div>


        </div>



        <!-- INPUT -->

        <div class="chat-input">


            <textarea
                id="messageInput"
                placeholder="Мәселеңізді жазыңыз..."
            ></textarea>


            <button
                class="send-btn"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>


        </div>

    </div>


    <div class="info">

        MEDCARE техникалық қолдау жүйесі.

    </div>


</div>



<script>



const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const chat =
    document.getElementById("chat");


// Соңғы тексерілген уақыт
let lastReplyCheck =
    Date.now();


// ======================================================
// ENTER
// ======================================================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ======================================================
// ADD MESSAGE
// ======================================================

function addMessage(
    text,
    className
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        className;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


// ======================================================
// SEND TO TELEGRAM
// ======================================================

async function sendMessage() {

    const message =
        messageInput
            .value
            .trim();


    if (!message) {

        return;

    }


    // Пайдаланушы хабарламасы
    addMessage(
        message,
        "user-message"
    );


    messageInput.value = "";

    sendButton.disabled = true;

    sendButton.textContent = "…";


    try {

        const response =
            await fetch(

                "http://localhost:3000/api/support/telegram",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Хабарлама жіберілмеді"
            );

        }


        addMessage(
            "✅ Хабарламаңыз қолдау қызметіне жіберілді.",
            "system-message"
        );


    } catch (error) {

        console.error(
            error
        );


        addMessage(
            "❌ Хабарламаны жіберу мүмкін болмады.",
            "error-message"
        );


    } finally {

        sendButton.disabled = false;

        sendButton.textContent = "➤";

        messageInput.focus();

    }

}


// ======================================================
// SUPPORT ЖАУАПТАРЫН АЛУ
// ======================================================

async function checkReplies() {

    try {

        const response =
            await fetch(

                "http://localhost:3000/api/support/replies" +

                "?after=" +

                lastReplyCheck

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            return;

        }


        for (
            const reply
            of data.replies
        ) {

            addMessage(
                "🎧 MedCare Support\n\n" +
                reply.text,

                "support-message"
            );

        }


        lastReplyCheck =
            data.serverTime;


    } catch (error) {

        // Сервер уақытша қолжетімсіз болса
        // чатқа қате шығармаймыз

        console.log(
            "Support replies күтілуде..."
        );

    }

}


// Әр 2 секунд сайын жауап тексеру
setInterval(
    checkReplies,
    2000
);


// Бет ашылғанда
window.addEventListener(
    "load",
    function() {

        messageInput.focus();

        checkReplies();

    }
);


</script>

</body>
</html>
